name: Publish images after CI

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: publish-images
  cancel-in-progress: false

jobs:
  selection:
    name: Require successful push CI / skip documentation
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      required: ${{ steps.selection.outputs.required }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: github.event_name == 'workflow_run'
        with:
          name: ci-selection
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Select publication (missing or invalid receipts fail)
        id: selection
        run: |
          if [ '${{ github.event_name }}' = workflow_dispatch ]; then
            required=true
          else
            required=$(cat ci-selection.txt)
            [[ "$required" == true || "$required" == false ]]
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"
          echo "Image publication required: $required" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Native staged publication
    permissions:
      contents: read
      actions: write
      packages: write
    needs: selection
    if: needs.selection.outputs.required == 'true'
    uses: ./.github/workflows/images.yml
    with:
      publish: true
      revision: ${{ github.event.workflow_run.head_sha || github.sha }}
