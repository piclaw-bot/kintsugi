name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select required checks
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      required: ${{ steps.changes.outputs.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Classify changes (unknown changes require all checks)
        id: changes
        run: |
          base='${{ github.event.pull_request.base.sha || github.event.before }}'
          required=true
          images=true
          if [ '${{ github.event_name }}' != workflow_dispatch ] && [ -n "$base" ] && git fetch --depth=1 origin "$base"; then
            git diff --name-only "$base" HEAD > changed-files.txt
            if [ -s changed-files.txt ] && ! grep -Ev '^(docs/|notes/|readme\.md$|AGENTS\.md$|LICENSE$)' changed-files.txt; then
              required=false
            fi
            if [ -s changed-files.txt ] && ! grep -Ev '^(docs/|notes/|\.github/|readme\.md$|AGENTS\.md$|CONTEXT\.md$|acceptance/|scripts/ci-(images(\.test)?\.ts|smoke-app\.sh)$)|(^|/)test/|\.test\.(ts|js|mjs)$' changed-files.txt; then
              images=false
            fi
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"
          echo "## Check selection" >> "$GITHUB_STEP_SUMMARY"
          echo "Runtime checks required: $required. Unknown bases run all checks; documentation-only changes skip them." >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$images" > ci-selection.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: github.event_name == 'push'
        with:
          name: ci-selection
          path: ci-selection.txt
          retention-days: 1

  check:
    name: Checks then full tests (AMD64)
    needs: changes
    if: needs.changes.outputs.required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate all workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Restore Bun downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-1.4.2-${{ hashFiles('**/bun.lock', 'patches/**') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-1.4.2-
      - name: Install locked dependencies
        run: bun ci
      # Fail cheap checks before downloading a browser or installing test tools.
      - name: Lint and type-check
        run: bun run check
      - name: Restore Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - name: Provision only missing test dependencies
        run: |
          missing=()
          for tool in socat tmux ffmpeg; do
            if ! command -v "$tool"; then missing+=("$tool"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi
          sudo mkdir -p /work
          sudo chmod 1777 /work
          bun node_modules/@playwright/test/cli.js install chromium
          browser=$(bun -e 'import { chromium } from "@playwright/test"; console.log(chromium.executablePath())')
          if ldd "$browser" | grep 'not found'; then
            bun node_modules/@playwright/test/cli.js install-deps chromium
          fi
          # Root-owned installer fixtures must not change the runner's home.
          sudo mkdir -p /root/.cache
          sudo ln -s "$HOME/.cache/ms-playwright" /root/.cache/ms-playwright
      # Installer tests need chown. Their HOME stays isolated from cache owners.
      - name: Run the full test suite
        run: sudo --preserve-env=PATH "$(command -v bun)" run test
      - name: Record verification
        if: always()
        run: |
          {
            echo '## Verification'
            echo 'Commit: ${{ github.sha }}'
            echo 'Result: ${{ job.status }}. Full tests run once on AMD64; native ARM64 image execution is checked by the image workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
